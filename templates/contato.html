{% extends "base.html" %}
{% block title %} <title>Contatos</title> {% endblock %}

{% block content %}

<h1 class="title" style="text-align: center;">Me contate</h1>
<div class="img-center">
    <a href="https://www.linkedin.com/in/fernando-henrique-de-s%C3%A1-ferreira-250623352/" target="_blank">
        <img src="{{ url_for('static', filename='images/linkedin.png') }}" alt="linkedin">
    </a>
    <a href="https://www.instagram.com/fesafer/" target="_blank">
        <img src="{{ url_for('static', filename='images/instagram.png') }}" alt="instagram">
    </a>
    <a href="https://github.com/fesafer" target="_blank">
        <img src="{{ url_for('static', filename='images/github.png') }}" alt="github">
    </a>
    <a href="mailto:fesafer12@gmail.com">
        <img src="{{ url_for('static', filename='images/mail.png') }}" alt="mail">
    </a>
</div>

<h1 class="title" style="text-align: center;">Deixe uma avaliação</h1>
<div class="form-div">
    <form>
        <div class="form-label">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required placeholder="Seu nome">
        </div>

        <div class="form-label">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-label">
            <label for="mensagem">Deixe sua mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva aqui..."></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>
</div>

<footer>
    <p style="display: block; text-align: center; margin-top: 40px;">© Todos os direitos reservados a Twenty One Pilots
        <br>
        Fernando Henrique de Sá Ferreira - FATEC - DSM 1º Semestre - 2026</p>
</footer>

{% endblock %}

{% block scripts %}
<script>
    const form = document.querySelector('form');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        form.reset();
    });
</script>
{% endblock %}
