<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title%} <title>21Pilots</title> {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logoclancy.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Piazzolla:ital,opsz,wght@0,8..30,100..900;1,8..30,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-fluid my-4">
        
        <nav class="navbar mb-4">
             <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Quem são?</a></li>
                <li><a href="{{ url_for('historia') }}">História</a></li>
                <li><a href="{{ url_for('contato') }}">Contato</a></li>
            </ul>
            <img src="{{ url_for('static', filename='images/Twenty_One_Pilots_logos_main_page-removebg-preview.png') }}" alt="logo-eras" class="nav-img">
        </nav>

        {% block content %}{% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
